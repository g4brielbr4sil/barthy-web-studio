
  <!DOCTYPE html>
  <html lang="pt-BR">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Refine landing page design</title>
      <meta name="description" content="This premium landing page web application offers a refined and fluid user experience, designed to engage visitors and enhance brand identity." />
      <meta name="robots" content="noindex, nofollow" />
      <meta name="theme-color" content="#0A1931" />
      <script>
        (function () {
          var theme = "dark";
          try {
            theme = localStorage.getItem("barthy-theme") === "light" ? "light" : "dark";
          } catch (error) {
            theme = "dark";
          }
          var root = document.documentElement;
          root.classList.toggle("dark", theme === "dark");
          root.style.colorScheme = theme;
          root.style.backgroundColor = theme === "dark" ? "#0A1931" : "#EAF1F7";
          document.querySelector('meta[name="theme-color"]').setAttribute(
            "content",
            theme === "dark" ? "#0A1931" : "#EAF1F7"
          );
        })();
      </script>
      <style>
        html, body { min-height: 100%; margin: 0; background-color: inherit; }
        #root { min-height: 100%; }
      </style>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
