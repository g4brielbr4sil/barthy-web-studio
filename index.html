
  <!DOCTYPE html>
  <html lang="pt-BR">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Refine landing page design</title>
      <meta name="description" content="This premium landing page web application offers a refined and fluid user experience, designed to engage visitors and enhance brand identity." />
      <meta name="robots" content="noindex, nofollow" />
      <meta name="theme-color" content="#0A1931" />
      <script>
        (function () {
          var theme = "dark";
          try {
            theme = localStorage.getItem("barthy-theme") === "light" ? "light" : "dark";
          } catch (error) {
            theme = "dark";
          }
          var root = document.documentElement;
          var isDark = theme === "dark";
          var background = isDark ? "#0A1931" : "#EAF1F7";
          root.dataset.theme = theme;
          root.classList.toggle("dark", isDark);
          root.style.colorScheme = theme;
          root.style.backgroundColor = background;
          document.querySelector('meta[name="theme-color"]').setAttribute("content", background);

          var applyBodyBackground = function () {
            if (document.body) document.body.style.backgroundColor = background;
          };
          if (document.body) applyBodyBackground();
          else document.addEventListener("DOMContentLoaded", applyBodyBackground, { once: true });
        })();
      </script>
      <style>
        :root,
        [data-theme="dark"] {
          --page-background: #0A1931;
          --hero-background: #0A1931;
          color-scheme: dark;
        }
        [data-theme="light"] {
          --page-background: #EAF1F7;
          --hero-background: #EAF1F7;
          color-scheme: light;
        }
        html, body, #root, main {
          min-height: 100%;
          margin: 0;
          background-color: var(--page-background, #0A1931);
        }
      </style>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
