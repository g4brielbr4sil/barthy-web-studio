
  <!DOCTYPE html>
  <html lang="pt-BR">

      />
      <meta name="robots" content="index, follow" />
      <link rel="canonical" href="https://barthy-web-studio.pages.dev/" />

      <meta property="og:type" content="website" />
      <meta property="og:locale" content="pt_BR" />
      <meta property="og:title" content="Barthy Web Studio | Páginas, sistemas e operação digital" />
      <meta
        property="og:description"
        content="A Barthy Web Studio cria páginas, sistemas, CRMs, dashboards e automações para empresas e profissionais que precisam apresentar, captar e organizar melhor sua operação."
      />
      <meta property="og:url" content="https://barthy-web-studio.pages.dev/" />
      <meta property="og:site_name" content="Barthy Web Studio" />

      <meta name="twitter:card" content="summary" />
      <meta name="twitter:title" content="Barthy Web Studio | Páginas, sistemas e operação digital" />
      <meta
        name="twitter:description"
        content="A Barthy Web Studio cria páginas, sistemas, CRMs, dashboards e automações para empresas e profissionais que precisam apresentar, captar e organizar melhor sua operação."
      />

      <meta name="theme-color" content="#0A1931" />
      <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
      <link rel="manifest" href="/site.webmanifest" />
      <script>
        (function () {
          var theme = "dark";
          try {
            theme = localStorage.getItem("barthy-theme") === "light" ? "light" : "dark";
          } catch (error) {
            theme = "dark";
          }
          var root = document.documentElement;
          var isDark = theme === "dark";
          var background = isDark ? "#0A1931" : "#EAF1F7";
          root.dataset.theme = theme;
          root.classList.toggle("dark", isDark);
          root.style.colorScheme = theme;
          root.style.backgroundColor = background;
          document.querySelector('meta[name="theme-color"]').setAttribute("content", background);

          var applyBodyBackground = function () {
            if (document.body) document.body.style.backgroundColor = background;
          };
          if (document.body) applyBodyBackground();
          else document.addEventListener("DOMContentLoaded", applyBodyBackground, { once: true });
        })();
      </script>
      <style>
        :root,
        [data-theme="dark"] {
          --page-background: #0A1931;
          --hero-background: #0A1931;
          color-scheme: dark;
        }
        [data-theme="light"] {
          --page-background: #EAF1F7;
          --hero-background: #EAF1F7;
          color-scheme: light;
        }
        html, body, #root, main {
          min-height: 100%;
          margin: 0;
          background-color: var(--page-background, #0A1931);
        }
      </style>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
